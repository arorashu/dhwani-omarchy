name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm git jq nodejs python qt6-declarative quickshell ruff curl dbus systemd mpv mpv-mpris
      - uses: actions/checkout@v4
      - name: Fetch Omarchy 4.0.2 contracts
        run: git clone --depth 1 --branch v4.0.2 https://github.com/basecamp/omarchy.git /tmp/omarchy
      - name: Validate manifest
        run: /tmp/omarchy/bin/omarchy-plugin-validate .
      - name: Lint QML
        run: |
          mkdir -p /tmp/qml-imports
          ln -s /tmp/omarchy/shell /tmp/qml-imports/qs
          /usr/lib/qt6/bin/qmllint -I /tmp/qml-imports BarWidget.qml Panel.qml Service.qml
      - name: Test Node suites
        run: node --test tests/*.test.js
      - name: Test offscreen QML runtime
        run: python tests/test_qml_runtime.py
      - name: Test playback and QML contracts
        run: python tests/test_play.py && python tests/test_qml_contract.py
      - name: Test isolated mpv/MPRIS playback pipeline
        run: python tests/test_playback_pipeline.py
      - name: Lint Python
        run: |
          ruff check --extend-select I,PLW1510 play.py tests
          ruff format --check play.py tests
