name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm git jq nodejs python qt6-declarative quickshell ruff
      - uses: actions/checkout@v4
      - name: Fetch Omarchy 4.0.2 contracts
        run: git clone --depth 1 --branch v4.0.2 https://github.com/basecamp/omarchy.git /tmp/omarchy
      - name: Validate manifest
        run: /tmp/omarchy/bin/omarchy-plugin-validate .
      - name: Lint QML
        run: |
          mkdir -p /tmp/qml-imports
          ln -s /tmp/omarchy/shell /tmp/qml-imports/qs
          /usr/lib/qt6/bin/qmllint -I /tmp/qml-imports BarWidget.qml Panel.qml Service.qml
      - name: Test model
        run: node tests/model.test.js
      - name: Test playback and state
        run: python tests/test_play.py && python tests/test_state.py && python tests/test_e2e.py
      - name: Lint Python
        run: ruff check play.py state.py tests && ruff format --check play.py state.py tests
